<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Valerion</title>

    <!-- OPTIMIZACIÓN: preconnect al CDN de Tailwind -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">

    <!-- OPTIMIZACIÓN: preload del JSON principal para que empiece a descargarse
         mientras el parser aún procesa el HTML -->
    <link rel="preload" href="valerion_data.json" as="fetch" crossorigin="anonymous">

    <!-- Tailwind (CDN, igual que antes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <style>
    /* ── Filtro de movimientos ── */
    .move-filter-wrapper {
        position: relative;
        width: 100%;
    }
    .move-filter-box {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem;
        min-height: 2.6rem;
        padding: 0.375rem 0.6rem;
        background: #111827;
        border-radius: 0.75rem;
        cursor: text;
        transition: box-shadow .2s;
    }
    .move-filter-box:focus-within {
        box-shadow: 0 0 0 2px #eab308;
    }
    .move-filter-input {
        flex: 1;
        min-width: 160px;
        background: transparent;
        border: none;
        outline: none;
        color: #d1d5db;
        font-size: 0.9rem;
        line-height: 1.5;
    }
    .move-filter-input::placeholder { color: #6b7280; }

    /* chip */
    .move-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.15rem 0.55rem;
        background: #1d4ed8;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        border-radius: 9999px;
        white-space: nowrap;
        user-select: none;
    }
    .move-chip button {
        display: flex;
        align-items: center;
        background: transparent;
        border: none;
        color: #93c5fd;
        cursor: pointer;
        padding: 0;
        font-size: 1rem;
        line-height: 1;
    }
    .move-chip button:hover { color: #fff; }

    /* dropdown */
    .move-autocomplete {
        position: absolute;
        top: calc(100% + 4px);
        left: 0; right: 0;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 0.75rem;
        max-height: 220px;
        overflow-y: auto;
        z-index: 200;
        padding: 0.25rem 0;
        box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .move-autocomplete.hidden { display: none; }
    .move-autocomplete li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
        font-size: 0.82rem;
        color: #d1d5db;
        transition: background .12s;
    }
    .move-autocomplete li:hover,
    .move-autocomplete li.active {
        background: #374151;
        color: #fff;
    }
    .move-autocomplete li .mv-type {
        font-size: 0.65rem;
        font-weight: 800;
        padding: 0.1rem 0.4rem;
        border-radius: 4px;
        text-transform: uppercase;
        color: #fff;
        flex-shrink: 0;
    }
    .move-autocomplete li .mv-cat {
        font-size: 0.65rem;
        color: #9ca3af;
        flex-shrink: 0;
    }
    .move-autocomplete li .mv-name { flex: 1; font-weight: 600; }
    .move-autocomplete li .mv-nomatch { color: #6b7280; font-style: italic; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans flex overflow-x-hidden">

    <div id="main-layout" class="flex-1 transition-all duration-300 w-full">
        <div class="container mx-auto p-4 lg:p-6">
            <header class="text-center mb-6">
                <h1 class="text-5xl font-black text-yellow-500 italic uppercase tracking-tighter">Valerion Dex</h1>
                <p class="text-gray-400 mt-1 text-sm">Ingeniería de Software | Base de Datos Digital</p>
            </header>

            <div class="max-w-7xl mx-auto bg-gray-800 p-4 rounded-2xl shadow-2xl border border-gray-700 mb-6">
                <div class="filter-row mb-4">
                    <input type="text" id="search" placeholder="Nombre del Pokémon..." class="filter-field">

                    <select id="gen-filter" class="filter-field">
                        <option value="all">Todas las Regiones</option>
                        <option value="Valerion">Región Valerion (Fakemon)</option>
                        <option value="Gen 1">Kanto (Gen 1)</option>
                        <option value="Gen 2">Johto (Gen 2)</option>
                        <option value="Gen 3">Hoenn (Gen 3)</option>
                        <option value="Gen 4">Sinnoh (Gen 4)</option>
                        <option value="Gen 5">Unova (Gen 5)</option>
                        <option value="Gen 6">Kalos (Gen 6)</option>
                        <option value="Gen 7">Alola (Gen 7)</option>
                        <option value="Gen 8">Galar (Gen 8)</option>
                        <option value="Gen 9">Paldea (Gen 9)</option>
                        <option value="Otras">Otras Generaciones</option>
                    </select>

                    <select id="type-1" class="filter-field focus:ring-blue-500">
                        <option value="all">Tipo 1: Todos</option>
                    </select>

                    <select id="type-2" class="filter-field focus:ring-red-500">
                        <option value="all">Tipo 2: Todos / Único</option>
                    </select>

                    <select id="ability-filter" class="filter-field">
                        <option value="all">Todas las Habilidades</option>
                    </select>
                </div>

                <!-- ── FILTRO DE MOVIMIENTOS ── -->
                <div class="move-filter-wrapper mt-3 mb-1">
                    <div class="move-filter-box" id="move-filter-box">
                        <!-- chips insertados aquí por JS -->
                        <input
                            type="text"
                            id="move-search-input"
                            class="move-filter-input"
                            placeholder="Filtrar por movimiento..."
                            autocomplete="off"
                        >
                    </div>
                    <ul id="move-autocomplete" class="move-autocomplete hidden"></ul>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 border-t border-gray-700 pt-4 mb-4">
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Ordenar:</label>
                        <select id="sort-by" class="flex-1 p-2 rounded-xl bg-gray-900 border-none focus:ring-2 focus:ring-yellow-500 text-gray-300 text-sm">
                            <option value="numero">Nº Pokédex</option>
                            <option value="nombre">Orden Alfabético</option>
                            <option value="bst">Total Stats (BST)</option>
                            <option value="hp">PS (Vida)</option>
                            <option value="atq">Ataque</option>
                            <option value="def">Defensa</option>
                            <option value="spa">At. Especial</option>
                            <option value="spd">Def. Especial</option>
                            <option value="vel">Velocidad</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs font-bold text-gray-500 uppercase">Dir:</label>
                        <select id="sort-direction" class="flex-1 p-2 rounded-xl bg-gray-900 border-none focus:ring-2 focus:ring-yellow-500 text-gray-300 text-sm">
                            <option value="asc">Ascendente (Menor a Mayor)</option>
                            <option value="desc">Descendente (Mayor a Menor)</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer text-xs text-gray-400 hover:text-white transition-colors">
                        <input type="checkbox" id="show-forms" class="w-4 h-4 accent-yellow-500" checked>
                        Mostrar formas alternativas
                    </label>
                    <button id="clear-btn" class="px-4 py-2 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-xl transition-all font-bold text-xs border border-red-600/50">
                        Limpiar Filtros
                    </button>
                </div>
            </div>

            <div id="pokedex" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3"></div>
        </div>
    </div>

    <div id="panel-overlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

    <aside id="details-panel" class="fixed top-0 right-0 h-full w-full lg:w-[40%] bg-gray-900 border-l border-gray-700 z-50 transform translate-x-full transition-transform duration-300 ease-out shadow-2xl flex flex-col">
        <button id="close-panel" class="absolute top-4 left-4 p-2 bg-gray-800 rounded-full hover:bg-gray-700 text-white z-10">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        <div id="panel-content" class="h-full overflow-y-auto custom-scrollbar"></div>
    </aside>

    <!-- OPTIMIZACIÓN: type="module" ya es diferido por defecto, no necesita defer -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
